[tool.poetry]
name = "depositor-bot"
version = "5.0.0"
description = "Bot that collects council signatures, checks blockchain state and signatures and do deposits. Also pause bot send pause tx if there is security warning."
authors = ["Raman <raman.s@lido.fi>"]
license = "MIT License"
readme = "README.md"
include = [
    "LICENSE",
]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
numpy = "1.26.4"
prometheus-client = "0.21.1"
web3-multi-provider = { version = "^2.2.7", extras = ["metrics"] }
schema = "^0.7.5"
websocket-client = "^1.4.1"
confluent-kafka = "^2.2.0"
web3 = "^7.8.0"
json-stream = "^2.3.2"
# SSZ + generated fork containers (in consensus-spec/eth_consensus_specs).
# Replaces py-ssz: eth-ssz-specs provides merkleization, generalized indices and proofs
# (ProgressiveContainer/ProgressiveList for Gloas). The other pins are import-time deps
# of the vendored consensus-specs types. Versions match consensus-specs pyproject.
eth-ssz-specs = "0.1.0"
ckzg = "2.1.8"
py_arkworks_bls12381 = "0.5.0"
blake3 = "1.0.9"
frozendict = "2.4.7"
lru-dict = "1.4.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.9"
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pyright = "^1.1.362"
pre-commit = "^3.8.0"

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "tests",
    "consensus-spec",
]
markers = [
    "unit", # offline
    "integration", # hardhat fork
]

[tool.ruff]
line-length = 140
# Generated consensus-specs types — not our code, never hand-styled. Excluded from lint/format.
extend-exclude = ["consensus-spec"]

[tool.ruff.lint]
ignore = ["B019"]
extend-select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
include = ["src"]
# Resolve `import eth_consensus_specs` (the generated types live here, put on sys.path at runtime
# by blockchain.beacon_state.__init__). Not type-checked itself — it is generated code.
extraPaths = ["consensus-spec"]
