[tool.poetry]
name = "depositor-bot"
version = "5.0.0"
description = "Bot that collects council signatures, checks blockchain state and signatures and do deposits. Also pause bot send pause tx if there is security warning."
authors = ["Raman <raman.s@lido.fi>"]
license = "MIT License"
readme = "README.md"
include = [
    "LICENSE",
]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "1.26.4"
prometheus-client = "0.21.1"
web3-multi-provider = { version = "^2.2.7", extras = ["metrics"] }
schema = "^0.7.5"
confluent-kafka = "^2.2.0"
web3 = "^7.8.0"
json-stream = "^2.3.2"
# Generated fork containers; the SSZ backend (eth-ssz-specs) is imported directly too.
eth-consensus-specs = "1.7.0b2"
eth-ssz-specs = "0.1.0"
# Imported by eth_consensus_specs.utils.kzg at import time, but only in the package's test extra.
ckzg = "2.1.8"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.9"
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pyright = "^1.1.362"
pre-commit = "^3.8.0"

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "tests",
]
markers = [
    "unit", # offline
    "integration", # hardhat fork
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
ignore = ["B019"]
extend-select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
include = ["src"]
