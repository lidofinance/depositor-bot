version: "3.7"
services:
  lido-depositor-bot:
    image: lidofinance/depositor-bot
    build: .
    container_name: lido-depositor-bot
    restart: unless-stopped
    ports:
      - 127.0.0.1:9000:9000
    environment:
      - WEB3_RPC_ENDPOINTS=${WEB3_RPC_ENDPOINTS}
      - LIDO_LOCATOR=${LIDO_LOCATOR}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - CREATE_TRANSACTIONS=${CREATE_TRANSACTIONS}
      - ONCHAIN_TRANSPORT_RPC_ENDPOINTS=${ONCHAIN_TRANSPORT_RPC_ENDPOINTS}
      - ONCHAIN_TRANSPORT_ADDRESS=${ONCHAIN_TRANSPORT_ADDRESS}
      - RELAY_RPC=${RELAY_RPC}
      - AUCTION_BUNDLER_PRIVATE_KEY=${AUCTION_BUNDLER_PRIVATE_KEY}
      - DEPOSIT_MODULES_WHITELIST=${DEPOSIT_MODULES_WHITELIST}
      - PROMETHEUS_PREFIX=${PROMETHEUS_PREFIX}
    command: depositor

  lido-pause-bot:
    image: lidofinance/depositor-bot
    build: .
    container_name: lido-pause-bot
    restart: unless-stopped
    ports:
      - 127.0.0.1:9001:9000
    environment:
      - WEB3_RPC_ENDPOINTS=${WEB3_RPC_ENDPOINTS}
      - LIDO_LOCATOR=${LIDO_LOCATOR}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - CREATE_TRANSACTIONS=${CREATE_TRANSACTIONS}
      - ONCHAIN_TRANSPORT_RPC_ENDPOINTS=${ONCHAIN_TRANSPORT_RPC_ENDPOINTS}
      - ONCHAIN_TRANSPORT_ADDRESS=${ONCHAIN_TRANSPORT_ADDRESS}
      - PROMETHEUS_PREFIX=${PROMETHEUS_PREFIX}
    command: pauser

  lido-unvetting-bot:
    image: lidofinance/depositor-bot
    build: .
    container_name: lido-unvetting-bot
    restart: unless-stopped
    ports:
      - 127.0.0.1:9002:9000
    environment:
      - WEB3_RPC_ENDPOINTS=${WEB3_RPC_ENDPOINTS}
      - LIDO_LOCATOR=${LIDO_LOCATOR}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY}
      - CREATE_TRANSACTIONS=${CREATE_TRANSACTIONS}
      - ONCHAIN_TRANSPORT_RPC_ENDPOINTS=${ONCHAIN_TRANSPORT_RPC_ENDPOINTS}
      - ONCHAIN_TRANSPORT_ADDRESS=${ONCHAIN_TRANSPORT_ADDRESS}
      - PROMETHEUS_PREFIX=${PROMETHEUS_PREFIX}
    command: unvetter
